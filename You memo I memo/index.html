<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>You memo? I memo!</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/p5@2/lib/p5.min.js"></script>

    <style>
      @font-face {
        font-family: 'Hippie';
        src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2610081905@hippie/hippie/hippie_히피체.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #1e2832;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      }
      body {
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas { display: block; touch-action: none; position: fixed; top: 0; left: 0; }

      #hint {
        position: fixed; left: 50%; bottom: calc(14vh + 12px);
        transform: translateX(-50%) translateY(6px);
        max-width: 86vw; padding: 9px 16px;
        border-radius: 999px;
        background: rgba(20, 30, 42, 0.38);
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        color: rgba(255, 255, 255, 0.92);
        font-size: 14px; letter-spacing: 0.01em; text-align: center;
        opacity: 0; pointer-events: none;
        transition: opacity .6s ease, transform .6s ease;
        z-index: 5;
      }
      #hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      #sizeBtn {
        position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px;
        width: 34px; height: 34px; padding: 0; box-sizing: border-box;
        display: flex; align-items: center; justify-content: center;
        border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(20, 30, 42, 0.32);
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        cursor: pointer; z-index: 6; touch-action: manipulation;
      }
      #sizeDot {
        display: block; width: 14px; height: 14px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.95);
        transition: width 0.16s ease, height 0.16s ease;
      }

      #typeBtn.on {
        background: rgba(255, 255, 255, 0.88);
        color: #16202c;
        border-color: rgba(255, 255, 255, 0.9);
      }
      #typeBtn {
        position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 54px;
        height: 34px; padding: 0 10px; box-sizing: border-box;
        border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(20, 30, 42, 0.32);
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        color: rgba(255, 255, 255, 0.92); font: inherit; font-size: 14px; line-height: 32px;
        cursor: pointer; z-index: 6; touch-action: manipulation;
      }

      #typer {
        position: fixed; left: 50%; top: 0; width: 1px; height: 1px;
        opacity: 0.01; border: 0; padding: 0; margin: 0; resize: none;
        background: transparent; color: transparent; caret-color: transparent;
        font-size: 16px;
        z-index: 0;
      }

      #helpBtn {
        position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px;
        width: 34px; height: 34px; border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(20, 30, 42, 0.32);
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        color: rgba(255, 255, 255, 0.9); font-size: 16px; line-height: 32px; text-align: center;
        padding: 0; cursor: pointer; z-index: 6; touch-action: manipulation;
      }
      #sizeBtn, #typeBtn, #resetBtn, #helpBtn { transition: opacity 0.22s ease; }
      body.viewing #sizeBtn,
      body.viewing #typeBtn,
      body.viewing #resetBtn,
      body.viewing #helpBtn { opacity: 0; pointer-events: none; }

      #helpPanel {
        position: fixed; top: calc(env(safe-area-inset-top, 0px) + 54px); right: 12px;
        width: max-content;
        max-width: min(387px, 86vw);
        padding: 16px 18px;
        border-radius: 18px;
        background: rgba(18, 26, 38, 0.62);
        -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: rgba(255, 255, 255, 0.92); font-size: 13.5px; line-height: 1.6;
        opacity: 0; pointer-events: none; transform: translateY(-6px);
        transition: opacity .35s ease, transform .35s ease; z-index: 6;
      }
      #helpPanel.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
      #helpPanel b { color: #cfe8ff; font-weight: 600; }
      #helpPanel .row { margin: 0 0 10px; }
      #helpPanel .row:last-child { margin-bottom: 0; }
      #helpPanel .pc { margin: 12px 0 0; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.15); opacity: .72; font-size: 12.5px; }
      #resetBtn {
        position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 54px;
        height: 34px; padding: 0 14px; box-sizing: border-box;
        border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(20, 30, 42, 0.32);
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        color: rgba(255, 255, 255, 0.9); font: inherit; font-size: 13px; line-height: 32px; white-space: nowrap;
        cursor: pointer; z-index: 6; touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <script>
      document.addEventListener("touchmove", function (e) {
        e.preventDefault();
      }, { passive: false });
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
        document.addEventListener(t, function (e) { e.preventDefault(); });
      });
</script>

    <div id="hint"></div>
    <button id="sizeBtn" aria-label="선 굵기"><i id="sizeDot"></i></button>
    <textarea id="typer" rows="1" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    <button id="typeBtn" aria-label="자판으로 쓰기">Aa</button>
    <button id="resetBtn" title="창틀에 보관된 물방울은 지워지지 않아요">모두 지우기</button>
    <button id="helpBtn" aria-label="도움말">?</button>
    <div id="helpPanel">
      <p class="row"><b>한 손가락으로 문지르기</b><br />창문 위로 그림이 그려져요</p>
      <p class="row"><b>한 손가락으로 꾹 누르기</b><br />입김이 번져서 주변 메모가 지워져요</p>
      <p class="row"><b>두 손가락으로 꾹 누르기 </b><br />누른 자리 주위의 메모만 성에로 얼어요</p>
      <p class="row"><b>두 손가락으로 아래로 쓸기</b><br />메모가 물방울이 되어 창틀로 흘러내려요</p>
      <p class="pc">PC : Shift 키와 마우스를 함께 사용하면 두 손가락 동작이 돼요.</p>
    </div>

    <script src="util.js"></script>
    <script src="scene.js"></script>
    <script src="dropgfx.js"></script>
    <script src="fog.js"></script>
    <script src="memo.js"></script>
    <script src="frost.js"></script>
    <script src="drops.js"></script>
    <script src="text.js"></script>
    <script src="gestures.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
